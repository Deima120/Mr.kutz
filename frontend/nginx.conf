# Configuración de Nginx para servir la SPA de Mr.Kutz.
#
# Cumple el mismo papel que vercel.json en el despliegue actual:
#   1. /api/*  → se reenvía al backend.
#   2. resto   → siempre index.html, para que React Router resuelva la ruta.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compresión: el bundle de React y los estilos son texto y bajan mucho de peso.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff font/woff2;

    # Nginx anuncia su versión en cada respuesta y en las páginas de error; es
    # información gratuita para quien busque vulnerabilidades conocidas.
    server_tokens off;

    # ---- API ---------------------------------------------------------------
    # El nombre `backend` lo resuelve el DNS interno de Docker: es el nombre del
    # servicio en docker-compose.yml. Fuera de compose habría que ajustarlo.
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Imprescindible: el backend hace `app.set('trust proxy', 1)` y limita
        # los intentos de login POR IP. Sin esta cabecera todos los usuarios
        # llegarían con la IP de Nginx y compartirían la misma cuota.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        # La base de datos gestionada puede tardar en despertar y el arranque
        # reintenta la conexión; 60s evita cortar una petición legítima.
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # Sonda de salud del backend, útil para comprobar el sistema completo desde
    # el mismo puerto que usa el navegador.
    location = /health {
        proxy_pass       http://backend:5000/health;
        proxy_set_header Host $host;
    }

    # ---- Estáticos ---------------------------------------------------------
    # Vite pone un hash en el nombre de cada archivo de /assets, así que su
    # contenido nunca cambia bajo el mismo nombre: se puede cachear un año.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ---- SPA ---------------------------------------------------------------
    # index.html NO se cachea: es el archivo que apunta a los bundles nuevos
    # tras cada despliegue. Si se cacheara, el navegador seguiría pidiendo los
    # archivos viejos, que ya no existen.
    location / {
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
